name: Sync Discord Webhooks

on:
  # Run manually from the Actions tab
  workflow_dispatch:

  # Run automatically every 6 hours
  schedule:
    - cron: "0 */6 * * *"

# The workflow itself only needs to read this repository.
# The separate WEBHOOK_GITHUB_TOKEN handles webhook management.
permissions:
  contents: read

jobs:
  sync:
    name: Sync Discord Webhooks
    runs-on: ubuntu-latest

    steps:
      # Download the repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Run the webhook manager
      - name: Sync webhooks
        env:
          # Fine-grained GitHub PAT stored in repository secrets
          GITHUB_TOKEN: ${{ secrets.WEBHOOK_GITHUB_TOKEN }}

          # Discord webhook URL stored in repository secrets
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

          # Automatically gets the owner of this repository
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          python3 sync_webhooks.py
